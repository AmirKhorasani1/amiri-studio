<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Amiri Studio | Frontend Developer Portfolio</title>

    <meta
      name="description"
      content="Amiri Studio portfolio. Frontend developer specializing in React, Next.js, Tailwind CSS and modern web applications."
    />

    <meta
      name="keywords"
      content="Frontend Developer, React, Next.js, Tailwind CSS, Portfolio, JavaScript, TypeScript"
    />

    <meta name="author" content="Amiri Studio" />

    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Amiri Studio | Frontend Developer Portfolio"
    />
    <meta
      property="og:description"
      content="Frontend Developer Portfolio built with React, Vite and Tailwind CSS."
    />

    <meta property="og:image" content="/favicon.svg" />

    <meta property="og:locale" content="en_US" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      rel="preload"
      href="/src/assets/fonts/geist/Geist[wght].woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      (function () {
        try {
          var lang = localStorage.getItem("site-language") || "en";
          var dir = lang === "fa" ? "rtl" : "ltr";
          document.documentElement.setAttribute("lang", lang);
          document.documentElement.setAttribute("dir", dir);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
